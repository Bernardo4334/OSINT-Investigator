name: OSINTigator43 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e

          for dir in "." "OSINT-Investigator" "OSINTigator43"; do
            if [ -f "$dir/settings.gradle" ] || \
               [ -f "$dir/settings.gradle.kts" ]; then
              if [ -d "$dir/app" ]; then
                echo "project_dir=$dir" >> "$GITHUB_OUTPUT"
                echo "Projeto encontrado em: $dir"
                exit 0
              fi
            fi
          done

          echo "::error::Não encontrei um projeto Gradle com a pasta app."
          echo "Ficheiros e pastas na raiz:"
          ls -la
          if [ -d "OSINT-Investigator" ]; then
            echo "Conteúdo de OSINT-Investigator:"
            ls -la OSINT-Investigator
          fi
          exit 1

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "${{ steps.locate.outputs.project_dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OSINTigator43-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
